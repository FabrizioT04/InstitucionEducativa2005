<ion-content class="dashboard-content" [fullscreen]="true">

  <!-- Flat Header Background -->
  <div class="header-background">
    <div class="header-content">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/tabs/tab1" color="light"></ion-back-button>
      </ion-buttons>
      <div class="header-title">
        <h1>Nuevo Comunicado</h1>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <div class="form-wrapper">

      <div class="input-group">
        <label>Título</label>
        <ion-item class="custom-input" lines="none">
          <ion-input placeholder="Ej: Suspensión de clases" [(ngModel)]="comunicado.titulo" type="text"
            required></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Mensaje</label>
        <ion-item class="custom-input textarea-input" lines="none">
          <ion-textarea placeholder="Escribe aquí el contenido del comunicado..." [(ngModel)]="comunicado.mensaje"
            [autoGrow]="true" rows="6" required>
          </ion-textarea>
        </ion-item>
      </div>

      <div class="action-container">
        <ion-button expand="block" class="publish-btn" (click)="saveComunicado()" [disabled]="guardando">
          <span *ngIf="!guardando">PUBLICAR COMUNICADO</span>
          <ion-spinner *ngIf="guardando" name="crescent"></ion-spinner>
        </ion-button>
      </div>

    </div>
  </div>

</ion-content>
