<ion-content class="modal-content">
  <div class="modal-handle"></div>

  <div class="modal-header">
    <h1>Añadir Nuevo Curso</h1>
  </div>

  <div class="form-container">
    <ion-spinner *ngIf="cargando" name="crescent" class="spinner-center"></ion-spinner>

    <div *ngIf="!cargando">
      <!-- Basic Info -->
      <div class="input-group">
        <label>Nombre del curso</label>
        <ion-item class="custom-input" lines="none">
          <ion-input placeholder="Ej: Cálculo Avanzado" [(ngModel)]="curso.nombre" type="text" required></ion-input>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Área académica</label>
        <ion-item class="custom-input" lines="none">
          <ion-input placeholder="Ej: Matemáticas" [(ngModel)]="curso.area" type="text"></ion-input>
        </ion-item>
      </div>

      <!-- Configuration -->
      <div class="section-title">Configuración</div>

      <div class="input-group">
        <label>Asignar Grado</label>
        <ion-item class="custom-input" lines="none">
          <ion-select placeholder="Seleccionar Grado" [(ngModel)]="asignacion.gradoId" interface="popover">
            <ion-select-option *ngFor="let grado of grados" [value]="grado.id">
              {{ grado.nombre }} - {{ grado.seccion }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </div>

      <div class="input-group">
        <label>Asignar Profesor</label>
        <ion-item class="custom-input" lines="none">
          <ion-select placeholder="Seleccionar Profesor" [(ngModel)]="asignacion.profesorId" interface="popover">
            <ion-select-option *ngFor="let profesor of profesores" [value]="profesor.id">
              {{ profesor.nombreCompleto }}
            </ion-select-option>
          </ion-select>
        </ion-item>
      </div>

      <!-- Students -->
      <div class="section-title">Estudiantes</div>
      <div class="students-list">
        <ion-item *ngFor="let estudiante of estudiantes" lines="none" class="student-item">
          <ion-checkbox slot="start" [(ngModel)]="estudiante.inscrito"></ion-checkbox>
          <ion-label>{{ estudiante.nombreCompleto }}</ion-label>
        </ion-item>
      </div>

      <!-- Actions -->
      <div class="action-buttons">
        <ion-button expand="block" fill="outline" class="cancel-btn" routerLink="/tabs/tab2">
          CANCELAR
        </ion-button>
        <ion-button expand="block" class="save-btn" (click)="guardarCursoCompleto()" [disabled]="guardando">
          <span *ngIf="!guardando">GUARDAR</span>
          <ion-spinner *ngIf="guardando" name="crescent"></ion-spinner>
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
