<ion-content class="login-content">
  <div class="login-container">

    <!-- Logo Section -->
    <div class="logo-section">
      <div class="logo-box">
        <ion-icon name="layers" color="light"></ion-icon>
      </div>
    </div>

    <!-- Title Section -->
    <div class="title-section">
      <h1>Bienvenido de nuevo</h1>
      <p>Inicia sesión para continuar</p>
    </div>

    <!-- Form Section -->
    <div class="form-section">

      <!-- Email Input -->
      <div class="input-wrapper">
        <label>Correo Electrónico</label>
        <div class="custom-input-container">
          <ion-icon name="mail-outline" class="input-icon"></ion-icon>
          <input type="email" placeholder="Introduce tu correo electrónico" [(ngModel)]="credentials.email"
            class="native-input">
        </div>
      </div>

      <!-- Password Input -->
      <div class="input-wrapper">
        <label>Contraseña</label>
        <div class="custom-input-container">
          <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
          <input [type]="showPassword ? 'text' : 'password'" placeholder="Introduce tu contraseña"
            [(ngModel)]="credentials.password" class="native-input">
          <ion-icon [name]="showPassword ? 'eye-outline' : 'eye-off-outline'" class="password-toggle"
            (click)="togglePassword()"></ion-icon>
        </div>
      </div>

      <!-- Forgot Password -->
      <div class="forgot-password">
        <a (click)="forgotPassword()">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Login Button -->
      <ion-button expand="block" class="login-btn" (click)="login()" color="primary">INGRESAR</ion-button>

      <!-- Register Link -->
      <div class="register-link">
        <span>¿No tienes una cuenta? </span>
        <a (click)="goToRegister()">Regístrate aquí</a>
      </div>

    </div>
  </div>
</ion-content>
