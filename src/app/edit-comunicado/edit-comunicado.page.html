<ion-content class="dashboard-content" [fullscreen]="true">

  <!-- Flat Header Background -->
  <div class="header-background">
    <div class="header-content">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/tabs/tab1" color="light"></ion-back-button>
      </ion-buttons>
      <div class="header-title">
        <h1>Editar Comunicado</h1>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    @if (cargando) {
    <div class="spinner-container">
      <ion-spinner name="crescent"></ion-spinner>
    </div>
    } @else {
    <!-- 1. Agrupamos los campos en una lista inset -->
    <ion-list [inset]="true">
      <ion-list-header>
        <ion-label>Contenido del Comunicado</ion-label>
      </ion-list-header>
      <ion-item>
        <ion-input label="Título" labelPlacement="floating" [(ngModel)]="comunicado.titulo" type="text"
          required></ion-input>
      </ion-item>
      <ion-item>
        <ion-textarea label="Mensaje" labelPlacement="floating" [(ngModel)]="comunicado.mensaje" [autoGrow]="true"
          required>
        </ion-textarea>
      </ion-item>
    </ion-list>

    <!-- 2. Botón de acción con padding -->
    <div class="ion-padding-vertical">
      <ion-button expand="block" (click)="guardarCambios()" [disabled]="guardando">
        <span *ngIf="!guardando">Guardar Cambios</span>
        <ion-spinner *ngIf="guardando" name="crescent"></ion-spinner>
      </ion-button>
    </div>
    }
  </div>

</ion-content>
