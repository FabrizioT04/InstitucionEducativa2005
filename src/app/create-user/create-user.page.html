<ion-content class="dashboard-content" [fullscreen]="true">

  <!-- Flat Header Background -->
  <div class="header-background">
    <div class="header-content">
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/user-list" color="light"></ion-back-button>
      </ion-buttons>
      <div class="header-title">
        <h1>Crear Nuevo Usuario</h1>
      </div>
    </div>
  </div>

  <!-- Main Container -->
  <div class="main-container">
    <!-- 1. Primera lista para los datos principales del usuario -->
    <ion-list [inset]="true">
      <ion-list-header>
        <ion-label>Información de la Cuenta</ion-label>
      </ion-list-header>

      <ion-item>
        <ion-input label="Nombre Completo" labelPlacement="floating" [(ngModel)]="usuario.nombreCompleto" type="text"
          required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Correo Electrónico" labelPlacement="floating" [(ngModel)]="usuario.email" type="email"
          required></ion-input>
      </ion-item>
      <ion-item>
        <ion-input label="Contraseña" labelPlacement="floating" [(ngModel)]="usuario.password" type="password"
          required></ion-input>
      </ion-item>
      <ion-item>
        <ion-select label="Rol del Usuario" [(ngModel)]="usuario.rol" interface="action-sheet">
          <ion-select-option value="estudiante">Estudiante</ion-select-option>
          <ion-select-option value="profesor">Profesor</ion-select-option>
          <ion-select-option value="administrador">Administrador</ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>

    <!-- 2. Segunda lista que solo aparece si el rol es 'estudiante' -->
    <ion-list [inset]="true" *ngIf="usuario.rol === 'estudiante'">
      <ion-list-header>
        <ion-label>Asignación Académica</ion-label>
      </ion-list-header>
      <ion-item>
        <ion-select label="Grado del Estudiante" labelPlacement="floating" [(ngModel)]="usuario.gradoId"
          interface="action-sheet" required>
          <ion-select-option *ngFor="let grado of grados$ | async" [value]="grado.id">
            {{ grado.nombre }} - {{ grado.seccion }}
          </ion-select-option>
        </ion-select>
      </ion-item>
    </ion-list>

    <!-- 3. Botón de acción principal con padding para separarlo de las listas -->
    <div class="ion-padding-vertical">
      <ion-button expand="block" (click)="crearUsuario()" [disabled]="guardando">
        <span *ngIf="!guardando">Crear Usuario</span>
        <ion-spinner *ngIf="guardando" name="crescent"></ion-spinner>
      </ion-button>
    </div>
  </div>

</ion-content>
